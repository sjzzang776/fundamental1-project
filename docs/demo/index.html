<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음성 주문 키오스크 데모</title>
<meta name="description" content="어르신을 위한 음성 주문 키오스크의 브라우저 데모 (서버 없이 동작)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root {
  --bg: #fff8e7; --surface: #ffffff; --text: #1a1a1a; --sub: #3d3d3d; --primary: #a8101a; --on-primary: #ffffff;
  --accent: #ffc72c; --line: #1a1a1a; --soft: #fdebc2; --bar: #1a1a1a; --track: #e8dfc8; --ok: #1b5e20;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1d1a14; --surface: #2a261e; --text: #f7f2e6; --sub: #ddd3bd; --primary: #c8202b; --line: #f7f2e6; --soft: #3a3324; --bar: #000; --track: #463e2c; --ok: #7fd38a; }
}
:root[data-theme="dark"] { --bg: #1d1a14; --surface: #2a261e; --text: #f7f2e6; --sub: #ddd3bd; --primary: #c8202b; --line: #f7f2e6; --soft: #3a3324; --bar: #000; --track: #463e2c; --ok: #7fd38a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
body { min-height: 100dvh; display: flex; justify-content: center; }
.app { width: 100%; max-width: 480px; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px 16px 0; }
.top { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--sub); }
.top b { color: var(--primary); font-size: 22px; }
.demo-tag { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1.5px solid var(--line); }
.track { height: 8px; background: var(--track); border-radius: 4px; margin: 8px 0 14px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.agent { display: flex; gap: 10px; align-items: flex-start; }
.face { font-size: 46px; line-height: 1; }
.bubble { flex: 1; background: var(--surface); border: 2.5px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 21px; font-weight: 700; line-height: 1.45; }
.heard { min-height: 22px; margin: 8px 2px 0; font-size: 15px; color: var(--sub); }
.heard b { color: var(--text); }
.mic { margin-top: 8px; width: 100%; min-height: 64px; border: 2.5px dashed var(--line); border-radius: 999px; background: var(--surface); color: var(--text);
  font-family: inherit; font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.mic.on { border-style: solid; background: var(--accent); color: #1a1a1a; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 199, 44, .35); } }
.typebox { display: none; gap: 8px; margin-top: 8px; }
.typebox.show { display: flex; }
.typebox input { flex: 1; min-width: 0; font-family: inherit; font-weight: 600; font-size: 17px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
.typebox button { font-family: inherit; font-weight: 700; font-size: 16px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--text); }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 14px 0; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: var(--surface); border: 2.5px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; cursor: pointer; color: var(--text); font: inherit; }
.card .em { font-size: 34px; background: var(--soft); border-radius: 10px; padding: 6px 0; }
.card .nm { font-weight: 700; font-size: 15px; margin-top: 6px; line-height: 1.3; min-height: 39px; display: flex; align-items: center; justify-content: center; }
.card .pr { color: var(--primary); font-weight: 900; font-size: 17px; }
.card .st { font-size: 12px; color: var(--sub); font-weight: 700; }
.btn { width: 100%; min-height: 68px; border-radius: 16px; border: 2.5px solid var(--line); background: var(--surface); color: var(--text);
  font-family: inherit; font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 14px; padding: 0 18px; cursor: pointer; text-align: left; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn .ico { font-size: 26px; width: 34px; text-align: center; }
.btn .ex { margin-left: auto; font-size: 15px; font-weight: 700; opacity: .9; }
.cart { background: var(--surface); border: 2.5px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.cart .row { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 700; padding: 4px 0; }
.cart .row span:last-child { white-space: nowrap; }
.sum { text-align: right; font-size: 18px; font-weight: 700; }
.sum b { color: var(--primary); font-size: 34px; font-weight: 900; }
.board { background: var(--surface); border: 2.5px solid var(--line); border-radius: 16px; padding: 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tabs button { flex: 1; font-family: inherit; font-weight: 700; font-size: 15px; padding: 8px 0; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--text); }
.tabs button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: var(--bar); margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.bottom button { min-height: 52px; border-radius: 12px; border: 0; font-family: inherit; font-weight: 700; font-size: 16px; background: #fff; color: #1a1a1a; }
.bottom button.staff { background: var(--accent); }
.idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.idle .logo { font-size: 120px; }
.idle h1 { margin: 0; font-size: 34px; }
.idle p { margin: 0; font-size: 20px; font-weight: 700; color: var(--sub); }
.idle p.note { font-size: 13px; font-weight: 500; }
.idle .btn { justify-content: center; font-size: 28px; min-height: 84px; }
.note { font-size: 13px; color: var(--sub); line-height: 1.5; }
.done-num { font-size: 88px; font-weight: 900; color: var(--primary); text-align: center; line-height: 1; }
.try { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
.try code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-family: inherit; font-weight: 700; color: var(--text); cursor: pointer; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--accent); color: #1a1a1a; font-weight: 700; padding: 10px 16px; border-radius: 12px; display: none; z-index: 5; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script type="module">
import { handle, newSession, prompt, pay, itemLabel, itemPrice, total, won, catalog } from './dialog.js'
import { MENUS, OPTIONS, GROUPS } from './data.js'

const STEPS = { DINE_TYPE: [1, '식사 장소'], MENU: [2, '메뉴 고르기'], OPTION: [3, '자세히 고르기'], CONFIRM: [4, '주문 확인'], PAYMENT: [5, '결제'], DONE: [6, '완료'] }
const ICONS = { 매장에서: '🍽️', 포장: '🛍️', 세트: '🍔🍟🥤', 단품: '🍔', 맞아요: '⭕', 수정할게요: '✏️', '추천해 주세요': '💡', 주문할게요: '🧾', '카드 결제': '💳',
  '네, 취소할게요': '🗑️', 아니요: '↩️', 미디엄: '🥤', 라지: '🥤' }
const EXAMPLES = {
  DINE_TYPE: ['포장해 주세요', '먹고 갈게요'],
  MENU: ['불고기 버거 세트 하나 주세요', '매운 닭 버거 두 개', '추천해 주세요', '음료 뭐 있어요'],
  MENU_MORE: ['콜라 하나 더 주세요', '다 골랐어요', '다 해서 얼마예요'],
  SET_OR_SINGLE: ['세트로 주세요', '단품이요', '라지로 주세요'],
  SET_DRINK: ['제로 콜라로', '커피로 주세요', '기본으로 주세요'],
  SET_SIZE: ['큰 걸로 주세요', '미디엄'],
  CONFIRM: ['맞아요', '콜라 말고 사이다로 바꿔 주세요', '하나 더 주세요', '잘못 말했어'],
  PAYMENT: ['결제할게요', '천천히 말해 줘'],
}

let s = null
let view = { reply: '', choices: [], question: null }
let heard = ''
let board = null // 메뉴판 카테고리
let rate = 1.0
let volume = 1.0
const app = document.getElementById('app')

// ---------- 소리 ----------
const synth = window.speechSynthesis
let koVoice = null
function pickVoice() { const v = synth?.getVoices() || []; koVoice = v.find((x) => x.lang?.startsWith('ko') && /Google|Natural|Yuna|Sora|Heami/i.test(x.name)) || v.find((x) => x.lang?.startsWith('ko')) || null }
synth?.addEventListener?.('voiceschanged', pickVoice); pickVoice()
function say(text) {
  if (!synth || !text) return
  synth.cancel()
  const u = new SpeechSynthesisUtterance(text.replace(/\(M\)/g, '미디엄'))
  u.lang = 'ko-KR'; u.rate = rate; u.volume = volume
  if (koVoice) u.voice = koVoice
  synth.speak(u)
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition
let rec = null
let listening = false
function listen() {
  if (!SR) { document.querySelector('.typebox')?.classList.add('show'); toast('이 브라우저는 음성 인식을 지원하지 않아요. 아래 칸에 글로 입력해 보세요.'); return }
  if (listening) { rec?.stop(); return }
  synth?.cancel()
  rec = new SR()
  rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false
  let final = ''
  rec.onresult = (e) => {
    let interim = ''
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript
      else interim += e.results[i][0].transcript
    }
    heard = final || interim; renderHeard()
  }
  rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('마이크 권한을 허용해 주세요. (주소창의 자물쇠 → 마이크)'); else if (e.error === 'no-speech') toast('말소리를 듣지 못했어요. 다시 눌러 말씀해 주세요.') }
  rec.onend = () => { listening = false; renderMic(); if (final.trim()) send(final.trim()) }
  listening = true; heard = ''; renderMic(); renderHeard()
  try { rec.start() } catch { listening = false; renderMic() }
}

// ---------- 흐름 ----------
function start() { s = newSession(); board = null; show({ reply: '안녕하세요! ' + prompt(s)[0], choices: prompt(s)[1], question: prompt(s)[2] }) }
function send(text) {
  if (!s) return
  heard = text
  const r = handle(s, text)
  for (const a of r.actions) {
    if (a === 'staff') toast('🙋 직원을 불렀어요 (데모)')
    if (a === 'voice:slower') rate = 0.8
    if (a === 'voice:faster') rate = 1.2
    if (a === 'voice:louder') volume = 1.0
    if (a.startsWith('menu:')) board = a === 'menu:close' ? null : a.slice(5) || '버거'
    if (a === 'pay') return doPay()
  }
  if (s.step !== 'MENU') board = null
  show(r)
}
function doPay() { show({ reply: '결제하고 있어요. 잠시만 기다려 주세요.', choices: [], question: 'PAYING' }); setTimeout(() => show(pay(s)), 1500) }
function press(label) {
  if (label === '카드 결제') return doPay()
  send(label)
}
function show(r) { view = r; render(); say(r.reply) }
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => (el.style.display = 'none'), 2600) }

// ---------- 그리기 ----------
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function menuCard(m) {
  return `<button class="card" data-say="${esc(m.name)}"><div class="em">${m.emoji}</div><div class="nm">${esc(m.name)}</div>
    <div class="pr">${won(m.price)}</div><div class="st">${m.setPrice ? '세트 ' + won(m.setPrice) : '&nbsp;'}</div></button>`
}
function choiceBtn(label, primary) {
  const opt = OPTIONS.find((o) => o.name === label && (view.question === 'SET_DRINK' ? o.group === '세트 음료' : view.question === 'SET_SIZE' ? o.group === '세트 사이즈' : true))
  const extra = opt?.extra ? `+${won(opt.extra)}` : label === '세트' ? '감자튀김 + 음료' : ''
  const ico = ICONS[label] || (opt ? (catalog.menus[MENUS.find((m) => m.name.startsWith(label))?.id]?.emoji || '🥤') : '👉')
  return `<button class="btn ${primary ? 'primary' : ''}" data-press="${esc(label)}"><span class="ico">${ico}</span>${esc(label)}<span class="ex">${extra}</span></button>`
}
function stageHtml() {
  const q = view.question
  if (q === 'DONE') return `<div class="done-num">${s.orderNumber}</div><p class="note" style="text-align:center">주문번호예요. 데모라 실제 주문은 들어가지 않아요.</p>
    <button class="btn primary" data-act="restart" style="justify-content:center">처음 화면으로</button>`
  if (q === 'CANCELLED') return `<button class="btn primary" data-act="restart" style="justify-content:center">처음 화면으로</button>`
  if (q === 'PAYING') return `<div style="text-align:center;font-size:80px">💳</div>`
  let html = ''
  if (board) {
    const cats = ['버거', '사이드', '음료', '디저트']
    html += `<div class="board"><div class="tabs">${cats.map((c) => `<button class="${c === board ? 'on' : ''}" data-board="${c}">${c}</button>`).join('')}</div>
      <div class="cards">${MENUS.filter((m) => m.category === board).map(menuCard).join('')}</div></div>`
  }
  const optionStep = ['SET_OR_SINGLE', 'SET_DRINK', 'SET_SIZE'].includes(q)
  const menuChoices = optionStep ? [] : view.choices.filter((c) => MENUS.some((m) => m.name === c))
  const others = view.choices.filter((c) => !menuChoices.includes(c))
  if (menuChoices.length && !board) html += `<div class="cards">${menuChoices.map((c) => menuCard(MENUS.find((m) => m.name === c))).join('')}</div>`
  if (['CONFIRM', 'PAYMENT', 'MENU_MORE', 'EDIT'].includes(q) && s.cart.length) {
    html += `<div class="cart">${s.cart.map((i) => `<div class="row"><span>${esc(itemLabel(i))} × ${i.quantity}</span><span>${won(itemPrice(i))}</span></div>`).join('')}</div>
      <div class="sum">모두 <b>${won(total(s))}</b></div>`
  }
  html += others.map((c, i) => choiceBtn(c, i === 0)).join('')
  if (q === 'MENU' || q === 'MENU_MORE') html += `<button class="btn" data-board="버거"><span class="ico">📋</span>메뉴판 보기</button>`
  return html
}
function renderHeard() { const el = document.querySelector('.heard'); if (el) el.innerHTML = heard ? `들은 말: <b>${esc(heard)}</b>` : '' }
function renderMic() { const el = document.querySelector('.mic'); if (!el) return; el.classList.toggle('on', listening); el.innerHTML = listening ? '🎙️ 듣고 있어요… (다시 누르면 끝)' : '🎤 눌러서 말하기' }
function examplesHtml() {
  const ex = EXAMPLES[view.question] || []
  return ex.length ? `<div class="try">이렇게 말해 보세요: ${ex.map((e) => `<code data-say="${esc(e)}">${esc(e)}</code>`).join(' ')}</div>` : ''
}
function render() {
  if (!s) {
    app.innerHTML = `<div class="top"><span>음성 주문 키오스크</span><span class="demo-tag">데모</span></div>
      <div class="idle"><div class="logo">🍔</div><h1>시연 매장</h1><p>말씀하시거나 화면의 버튼을 눌러<br>주문해 주세요.</p>
      <button class="btn primary" data-act="start">주문 시작</button><p style="font-size:16px">🎤 말로도 주문할 수 있어요</p>
      <p class="note">서버 없이 브라우저에서만 도는 데모예요. 말 이해 규칙은 실제 백엔드(nlu.py)를 그대로 옮겼고,<br>음성 인식·목소리는 브라우저 기능을 써요.
      휴대폰 크롬·사파리에서 마이크 권한을 허용해 주세요.</p></div>`
    return
  }
  const [n, label] = STEPS[s.step] || [6, '']
  app.innerHTML = `<div class="top"><b>${n}</b>/ 6 · ${label}<span class="demo-tag">데모</span></div>
    <div class="track"><i style="width:${(n / 6) * 100}%"></i></div>
    <div class="agent"><div class="face">🙂</div><div class="bubble">${esc(view.reply)}</div></div>
    <div class="heard"></div>
    ${['DONE', 'CANCELLED', 'PAYING'].includes(view.question) ? '' : `<button class="mic" data-act="mic"></button>
    <div class="typebox ${SR ? '' : 'show'}"><input placeholder="말 대신 글로 입력" enterkeyhint="send"><button data-act="type">보내기</button></div>${examplesHtml()}`}
    <div class="stage">${stageHtml()}</div>
    <div class="bottom"><button data-act="restart">↩ 처음으로</button><button data-say="취소할래요">✕ 취소</button><button class="staff" data-say="직원 불러 주세요">🙋 직원 부르기</button></div>`
  renderMic(); renderHeard()
}
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-press],[data-say],[data-board]')
  if (!t) return
  if (t.dataset.board) { board = t.dataset.board; render(); return }
  if (t.dataset.press) return press(t.dataset.press)
  if (t.dataset.say) return send(t.dataset.say)
  const act = t.dataset.act
  if (act === 'start') return start()
  if (act === 'restart') { s = null; synth?.cancel(); heard = ''; render(); return }
  if (act === 'mic') return listen()
  if (act === 'type') { const i = app.querySelector('.typebox input'); if (i.value.trim()) { send(i.value.trim()); } }
})
app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.typebox input') && e.target.value.trim()) send(e.target.value.trim()) })
render()
</script>
</body>
</html>
