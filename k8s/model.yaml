# 음성 인식 모델 서버. 이미지를 만들기 전에 bash model/scripts/fetch_model.sh 로 학습 모델을 받아 둔다 (model/README.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model
  template:
    metadata:
      labels:
        app: model
    spec:
      containers:
        - name: model
          image: model
          ports:
            - containerPort: 8001
          env:
            - name: BACKEND_URL # 메뉴 이름 힌트를 가져올 백엔드 주소
              value: http://backend:8000
          readinessProbe: # 모델을 다 불러온 뒤에만 요청을 받는다
            httpGet:
              path: /ready
              port: 8001
            periodSeconds: 5
          resources:
            # 음성 인식은 CPU를 많이 쓴다. 이슈 #18 추천(2개)으로 시작, 느리면 4개로 (model/README.md)
            requests:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model
spec:
  selector:
    app: model
  ports:
    - port: 8001
      targetPort: 8001
