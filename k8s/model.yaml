# 모델 서버 (음성 인식 + 의도 파악). 이미지를 만들기 전에 학습 모델을 받아 둔다 (model/README.md):
#   bash model/scripts/fetch_model.sh && bash model/scripts/fetch_nlu_model.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
spec:
  replicas: 1
  # 새 Pod 를 먼저 띄우면 CPU 16개 노드가 하나 더 필요해 GCP 전체 CPU 할당량(32)을 넘는다 (2026-10-19 3차 배포에서 Pending).
  # 그래서 이전 Pod 를 먼저 내리고 새 Pod 를 올린다. 바꾸는 1~2분 동안 음성 인식이 멈추고 백엔드는 규칙만 쓴다.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app: model
  template:
    metadata:
      labels:
        app: model
    spec:
      containers:
        - name: model
          image: model
          ports:
            - containerPort: 8001
          env:
            - name: BACKEND_URL # 메뉴 이름 힌트를 가져올 백엔드 주소
              value: http://backend:8000
            - name: NLU_GEN_THREADS # 생성 모델(nlu-gen-v1) CPU 스레드 = 아래 cpu 요청과 같게
              value: "8"
          readinessProbe: # 모델을 다 불러온 뒤에만 요청을 받는다
            httpGet:
              path: /ready
              port: 8001
            periodSeconds: 5
          resources:
            # 생성 모델(nlu-gen-v1)이 CPU 를 가장 많이 쓴다: 문장당 CPU 8개 0.6~1.7초, 4개 2.3~3.3초 (PR #30)
            # Autopilot 은 CPU 1개당 메모리 1GiB 이상이어야 해서 8Gi. 비용을 줄이려면 cpu 4 · memory 4Gi · NLU_GEN_THREADS 4
            requests:
              cpu: "8"
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model
spec:
  selector:
    app: model
  ports:
    - port: 8001
      targetPort: 8001
