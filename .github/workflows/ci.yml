# PR이 올라오거나 main이 바뀔 때마다 GitHub 서버에서 4개 컨테이너를 띄워 연결을 확인합니다.
# 이 확인이 실패하면 AI(wrap-up)는 Merge하지 않습니다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-check:
    name: Docker 실행 확인
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: .env 준비 (예시 값 사용)
        run: cp .env.example .env

      - name: 빌드 및 실행
        run: docker compose up -d --build

      - name: 연결 확인
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health | grep -q '"db":true'; then
              break
            fi
            sleep 2
          done
          echo "백엔드 → DB";        curl -fsS http://localhost:8000/api/health | grep -q '"db":true'
          echo "프론트(Nginx) → 백엔드"; curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          echo "백엔드 → 모델";      curl -fsS -X POST http://localhost:8000/api/predict \
            -H 'Content-Type: application/json' -d '{"text":"ci"}' | grep -q '"result"'
          echo "모두 통과"

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs --tail 100

      - name: 정리
        if: always()
        run: docker compose down -v
